services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8003}
    container_name: context-engineering-frontend
    ports:
      # Map host port from environment variable to container port 80 (nginx)
      - "${FRONTEND_PORT:-3003}:80"
    environment:
      - NODE_ENV=production
      # Backend API URL - use API_PORT from environment if available
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8003}}
      # Port configuration (for reference, nginx runs on 80 internally)
      - FRONTEND_PORT=${FRONTEND_PORT:-3003}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
