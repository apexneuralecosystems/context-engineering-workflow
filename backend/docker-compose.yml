services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: context-engineering-backend
    ports:
      # Map host port from environment variable to container port from environment variable
      - "${API_PORT:-8003}:${API_PORT:-8003}"
    environment:
      # API Keys (set these in .env file)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TENSORLAKE_API_KEY=${TENSORLAKE_API_KEY}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - ZEP_API_KEY=${ZEP_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      # Configuration - Ports from environment variables
      - API_PORT=${API_PORT:-8003}
      - FRONTEND_PORT=${FRONTEND_PORT:-3003}
      - QDRANT_DB_PATH=/app/qdrant_db
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - DEBUG=${DEBUG:-false}
      # OpenRouter Configuration
      - OPENROUTER_REFERER=${OPENROUTER_REFERER:-https://github.com/your-repo}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-Research Assistant}
    volumes:
      # Persist database and data
      - ./qdrant_db:/app/qdrant_db
      - ./data:/app/data
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      # Use environment variable for health check port
      # Note: docker-compose doesn't expand env vars in CMD-SHELL, so we use a script
      test: ["CMD", "sh", "-c", "curl -f http://localhost:$$API_PORT/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
